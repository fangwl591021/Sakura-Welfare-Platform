name: Deploy Sakura Welfare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakura-welfare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Worker syntax
        run: npm run check:welfare

      - name: Verify Sakura deployment bindings
        run: npm run predeploy:welfare

      - name: Deploy Sakura Worker
        run: npx wrangler deploy -c wrangler.sakura-welfare.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}