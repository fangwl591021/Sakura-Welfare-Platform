<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>廠商管理 | SAKURA Welfare</title>
  <style>
    :root{--green:#06c755;--ink:#071226;--muted:#64748b;--line:#dbe3ee;--bg:#f5f7fa;--red:#df1124;--blue:#2563eb;--amber:#f59e0b}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:14px;overflow:hidden}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{height:100vh;padding:8px 18px 18px;display:flex;flex-direction:column;gap:10px}.hint,.muted{color:var(--muted);font-size:13px;line-height:1.55}.name{font-weight:900}.danger{color:#b91c1c;font-weight:900}
    .tabs{display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);min-height:42px}.tab{border:0;background:transparent;padding:9px 12px 10px;font-weight:900;color:#475569;border-bottom:3px solid transparent;white-space:nowrap}.tab.active{color:var(--red);border-bottom-color:var(--red);background:#ecfdf5}
    .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:800}.stat b{display:block;margin-top:3px;font-size:22px;line-height:1.1}
    #view{min-height:0;flex:1;overflow:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.panel-head,.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head{padding:12px 14px;border-bottom:1px solid var(--line)}.toolbar{margin-bottom:10px}.panel-title{font-size:16px;font-weight:950}.search{width:360px;max-width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff}.empty{padding:28px;text-align:center;color:var(--muted)}
    table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{background:#f8fafc;color:#475569;font-size:12px;font-weight:900;position:sticky;top:0;z-index:1}td{font-size:13px}.table-wrap{overflow:auto}.nowrap{white-space:nowrap}.wide{min-width:240px}.crm-row{cursor:pointer}.crm-row:hover{background:#f8fafc}.title-link{border:0;background:transparent;color:#0369a1;font-weight:950;padding:0;text-align:left}.code{color:#64748b;margin-top:3px}
    .badge{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:0 9px;font-size:12px;font-weight:900;background:#eef2ff;color:#3730a3}.needs_supplement,.pending,.pending_review{background:#fef3c7;color:#92400e}.approved,.active,.confirmed{background:#dcfce7;color:#166534}.rejected,.suspended,.inactive,.failed,.archived{background:#fee2e2;color:#991b1b}.draft,.visitor{background:#f1f5f9;color:#475569}.employee{background:#dbeafe;color:#1d4ed8}.new{background:#e0f2fe;color:#075985}
    .actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;font-weight:900;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.amber{background:#fff7ed;border-color:#fed7aa;color:#c2410c}.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{cursor:not-allowed;opacity:.55}
    .detail{display:grid;gap:10px}.detail-head{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:14px;align-items:start}.detail-name{font-size:20px;font-weight:950}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.info{border:1px solid #edf1f7;border-radius:8px;background:#fff;padding:12px}.info h3{margin:0 0 8px;font-size:14px;color:#b91c1c}.kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px;padding:4px 0}.kv span{color:#64748b;font-weight:850}.kv b{font-weight:650;word-break:break-word}.note{white-space:pre-wrap;line-height:1.7;color:#334155}
    .carousel-grid{display:grid;gap:9px;margin-top:12px}.carousel-item{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px;background:#f8fafc}.carousel-item img{width:90px;height:68px;object-fit:contain;background:#fff;border-radius:8px}.carousel-item-actions{display:flex;gap:6px;flex-wrap:wrap}.carousel-upload-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}.carousel-upload-row input{width:100%}.location-editors{display:grid;gap:10px}.location-editor{border:1px solid var(--line);border-radius:8px;background:#f8fafc;padding:12px}.location-editor-title{font-weight:950;margin-bottom:9px}.rich-field{min-width:0}.rich-toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border:1px solid #cfd8e6;border-bottom:0;border-radius:8px 8px 0 0;background:#f8fafc}.rich-tool{min-width:36px;min-height:32px;border:1px solid #dbe3ee;border-radius:6px;background:#fff;color:#1e293b;font-weight:900;padding:0 9px}.rich-editor{min-height:180px;border:1px solid #cfd8e6;border-radius:0 0 8px 8px;background:#fff;padding:12px;line-height:1.7;overflow:auto}.rich-editor:focus{outline:2px solid #93c5fd;outline-offset:-2px}.rich-editor h2,.rich-editor h3{margin:8px 0}.rich-editor p{margin:6px 0}.formline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px}.field label{display:block;margin-bottom:5px;font-size:12px;color:#475569;font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd8e6;border-radius:8px;padding:9px 10px;background:#fff;min-height:38px}.field textarea{min-height:96px;resize:vertical}.full{grid-column:1/-1}.form-section{border-top:1px solid var(--line);padding:14px}.form-section h3{margin:-14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:#b91c1c;cursor:pointer;user-select:none}.form-section h3::after{content:"⌃";color:#64748b;font-size:18px;line-height:1;transition:transform .18s ease}.form-section.collapsed h3::after{transform:rotate(180deg)}.form-section.collapsed>:not(h3){display:none}.form-section:not(.collapsed)>h3{margin-bottom:12px}.form-section h3:focus-visible{outline:2px solid var(--blue);outline-offset:-3px;border-radius:6px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.reply{border:1px solid #bbf7d0;background:#ecfdf5;border-radius:8px;padding:12px;line-height:1.8;white-space:pre-wrap}.map-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:14px}.map-cell{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px;font-weight:900}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 12px 30px rgba(15,23,42,.22);display:none;z-index:20}.toast.show{display:block}
    @media(max-width:1260px){body{overflow:auto}.wrap{height:auto}.stats{grid-template-columns:repeat(3,1fr)}#view{overflow:visible}.detail-head{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}.formline,.form-grid{grid-template-columns:1fr 1fr}.map-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.stats,.detail-grid,.formline,.form-grid{grid-template-columns:1fr}.map-grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px 12px}.toolbar{display:grid}.search{width:100%}th,td{white-space:normal}.actions{justify-content:flex-start}}
    /* Vendor management readable typography */
    body{font-size:17px;line-height:1.5}
    .wrap>*,.panel,.table-wrap,.field,.info{min-width:0}
    .tabs{flex-shrink:0;min-height:52px}.tab{font-size:17px;padding:12px 16px}
    .stats{flex-shrink:0}.stat{padding:14px 16px}.stat span{font-size:16px;line-height:1.5}.stat b{font-size:28px;line-height:1.3}
    .hint,.muted,.code{font-size:16px;line-height:1.6}
    .panel-title{font-size:20px}.panel-head{font-size:18px}
    .toolbar{flex-wrap:wrap;align-items:flex-start}.toolbar>.actions{flex:1 1 560px;min-width:0}.toolbar .search{flex:1 1 280px;min-width:0}
    .search{font-size:17px;min-height:46px;height:auto;padding:10px 12px}
    .search-controls{display:flex;align-items:center;gap:8px;flex:1 1 440px;min-width:0}.search-controls .search{width:100%;min-width:100px;flex:1 1 220px}.search-controls .btn{flex:none;min-height:46px}
    @media(max-width:720px){.search-controls{width:100%;flex-wrap:wrap}.search-controls .search{flex-basis:100%}}
    .vendor-scroll-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}.vendor-scroll-controls .hint{margin-left:4px}
    .table-wrap{max-width:100%}th,td{min-width:96px;padding:12px 14px}th{font-size:16px;white-space:nowrap}td{font-size:17px;line-height:1.6}
    .table-wrap th:first-child,.table-wrap td:first-child{min-width:260px}
    .wide{min-width:280px}.code{overflow-wrap:anywhere}
    .badge{font-size:15px;line-height:1.5;min-height:30px;white-space:nowrap}
    .actions{gap:8px}td.actions{min-width:300px}
    .btn{font-size:16px;min-height:44px;padding:8px 14px;white-space:nowrap}
    .detail-name{font-size:26px}.info h3{font-size:18px}.kv{grid-template-columns:100px minmax(0,1fr)}
    .field label{font-size:16px;line-height:1.5}.field input,.field select,.field textarea{font-size:17px;min-height:44px}
    .form-section h3{font-size:18px}.rich-tool{font-size:16px;min-height:40px}.rich-editor{font-size:17px}
    @media(max-width:720px){.toolbar>.actions{flex-basis:auto;width:100%;justify-content:flex-start}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:12px}.stat b{font-size:26px}.kv{grid-template-columns:90px minmax(0,1fr)}}
    .supplement-summary{margin:10px 0;padding:12px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;overflow-wrap:anywhere}.supplement-summary p{white-space:pre-wrap;margin:8px 0}.supplement-summary ul{margin:8px 0;padding-left:24px}
    .vendor-branch-review{padding:14px;border-top:1px solid var(--line)}.vendor-branch-review h3{margin:0 0 6px;font-size:18px;color:#b91c1c}.vendor-branch-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px;margin-top:12px}.vendor-branch-card{min-width:0;border:1px solid var(--line);border-radius:9px;padding:12px;background:#f8fafc;overflow-wrap:anywhere}.vendor-branch-card strong{display:block}.vendor-branch-card p{margin:4px 0}.vendor-branch-state{display:inline-block;margin-top:7px;padding:4px 9px;border-radius:999px;background:#fef3c7;color:#92400e;font-weight:700;font-size:14px}.vendor-branch-state.is-active{background:#dcfce7;color:#166534}@media(max-width:480px){.vendor-branch-list{grid-template-columns:1fr}}
    #vendorSupplementDialog{width:min(620px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:12px;color:var(--ink);overflow:auto}#vendorSupplementDialog::backdrop{background:rgba(15,23,42,.45)}#vendorSupplementForm{padding:20px;display:grid;gap:14px}#vendorSupplementForm h2{font-size:22px;margin:0}#vendorSupplementForm fieldset{border:0;padding:0;margin:0;min-width:0}#vendorSupplementForm legend{font-weight:900;margin-bottom:8px}.supplement-items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.supplement-items label{display:flex;align-items:start;gap:8px;border:1px solid var(--line);padding:10px;border-radius:8px}.supplement-items input{margin-top:5px;flex-shrink:0}#vendorSupplementResult{white-space:pre-wrap;overflow-wrap:anywhere}#vendorSupplementResult:empty{display:none}@media(max-width:480px){.supplement-items{grid-template-columns:1fr}#vendorSupplementForm{padding:16px}}
    [data-vendor-line-code-box] label{display:block;font-weight:700}
    [data-vendor-line-code]{display:block;width:min(100%,420px);box-sizing:border-box;margin:6px 0 10px;padding:10px 12px;border:1px solid #cfd8e6;border-radius:8px;background:#fff;color:#071226;font:18px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
    [data-vendor-line-code-box] .actions{justify-content:flex-start;flex-wrap:wrap}
    .vendor-line-account{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 0;border-bottom:1px solid #dbe3ee}
    .vendor-line-account-info{flex:1;min-width:min(100%,260px)}
    .vendor-line-account-name{display:block;font-size:18px;color:#10263b;overflow-wrap:anywhere}
    .vendor-line-account-status{margin-top:4px;color:#435870}
    .vendor-line-account-uid{margin-top:4px;font-size:14px;line-height:1.5;color:#435870;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="vendor-review">廠商註冊審核</button>
      <button class="tab" data-tab="vendors">特約店家資料</button>
      <button class="tab" data-tab="offers">商品與優惠上架</button>
      <button class="tab" data-tab="offer-review">優惠審核待辦</button>
      <button class="tab" data-tab="store-map">全省特約店地圖</button>
      <button class="tab" data-tab="ocr">AI OCR 上架助手</button>
      <button class="tab" data-tab="redemptions">消費折抵</button>
      <button class="tab" data-tab="points">點數讀寫</button>
      <button class="tab" data-tab="ai">多語與 AI 詢問</button>
      <button class="tab" data-tab="knowledge">知識庫</button>
      <button class="tab" data-tab="reports">報表</button>
    </div>
    <section class="stats">
      <div class="stat"><span>廠商總數</span><b id="sVendorTotal">0</b></div>
      <div class="stat"><span>待審廠商</span><b id="sVendorPending">0</b></div>
      <div class="stat"><span>已核准廠商</span><b id="sVendorApproved">0</b></div>
      <div class="stat"><span>優惠總數</span><b id="sOfferTotal">0</b></div>
      <div class="stat"><span>待審優惠</span><b id="sOfferPending">0</b></div>
      <div class="stat"><span>折抵筆數</span><b id="sRedemptionTotal">0</b></div>
    </section>
    <section id="view"></section>
  </div>
  <div id="toast" class="toast"></div>
  <dialog id="locationBusyDialog" aria-label="正在儲存"><p role="status" aria-live="polite">正在儲存，請稍候…</p></dialog>
  <dialog id="vendorSupplementDialog" aria-labelledby="vendorSupplementTitle">
    <form id="vendorSupplementForm" novalidate>
      <h2 id="vendorSupplementTitle">要求補件</h2>
      <div id="vendorSupplementTarget"></div>
      <div class="supplement-summary"><b>通知申請人</b><p id="vendorSupplementApplicant"></p><p id="vendorSupplementIdentityNote" class="hint"></p><label id="vendorSupplementIdentityLabel"><input type="checkbox" id="vendorSupplementIdentity"> 我已核對此申請人的 LINE 帳號，通知此申請人</label></div>
      <p class="hint">保存後將通知這筆申請的送件 LINE 帳號。未綁定或未驗證的帳號不會推送。其他尚未儲存的廠商欄位不會一併儲存。</p>
      <fieldset><legend>補件項目（至少一項）</legend><div id="vendorSupplementItems" class="supplement-items"></div></fieldset>
      <div class="field"><label for="vendorSupplementOther">其他補件項目（每行一項，每項最多 200 字）</label><textarea id="vendorSupplementOther" rows="2" maxlength="4000"></textarea></div>
      <div class="field"><label for="vendorSupplementNote">補件原因與說明 *</label><textarea id="vendorSupplementNote" required maxlength="2000" placeholder="請清楚說明缺少什麼，以及廠商應如何補正。"></textarea><div class="hint">最多 2,000 字；此說明會顯示給廠商。</div></div>
      <div id="vendorSupplementResult" role="status" aria-live="polite"></div>
      <div class="actions"><button class="btn" id="vendorSupplementCancel" type="button">取消</button><button class="btn amber" id="vendorSupplementSubmit" type="submit">確認要求補件並通知</button></div>
    </form>
  </dialog>
  <script>
    const moduleTabMap = { "vendor-review":"vendor-review", vendors:"vendors", offers:"offers", ocr:"ocr", "offer-review":"offer-review", "store-map":"store-map", redemptions:"redemptions", points:"points", "mother-api":"points", ai:"ai", knowledge:"knowledge", reports:"reports" };
    const initialTab = moduleTabMap[new URL(location.href).searchParams.get("module") || "vendor-review"] || "vendor-review";
    const state = { tab: initialTab, q: "", searchText: "", visibility: "visible", loadVersion: 0, selectedVendorId: "", knowledgeType: "text", data: { vendors: [], offers: [], locations: [], redemptions: [], summary: {} } };
    const cities = ["基隆市","台北市","新北市","桃園市","新竹縣市","苗栗縣","台中市","彰化縣","南投縣","雲林縣","嘉義縣市","台南市","高雄市","屏東縣","宜花東","澎湖/金門/馬祖"];
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
    const money = (v) => Number(v || 0).toLocaleString("zh-TW");
    const sortTime = (v) => Date.parse(v.created_at || v.updated_at || v.reviewed_at || "") || 0;
    function toast(text){ const el = $("#toast"); el.textContent = text; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2400); }
    function label(v){ return ({needs_supplement:"待補件",pending:"待審",approved:"已核准",suspended:"停權",rejected:"退回",draft:"草稿",pending_review:"待審",archived:"封存",active:"啟用",inactive:"停用",new:"新合作",renewing:"續約中",expired:"已到期",confirmed:"已確認",voided:"已作廢",employee:"員工",visitor:"用戶",committee:"委員",vendor:"廠商"}[v] || v || "未填"); }
    function badge(v){ return '<span class="badge ' + esc(v || "") + '">' + esc(label(v)) + '</span>'; }
    function kv(k,v){ return '<div class="kv"><span>' + esc(k) + '</span><b>' + (String(v || "").startsWith("<") ? v : esc(v || "未填")) + '</b></div>'; }
    function docLink(v){ return v ? '<a href="' + esc(v) + '" target="_blank" rel="noopener">查看</a>' : '<span class="danger">未附</span>'; }
    function missingDocs(v){ const a=[]; if(!v.business_license_url)a.push("缺營登"); if(!v.insurance_policy_no&&!v.insurance_file_url)a.push("缺保險"); if(!v.contract_end)a.push("合約未填"); return a.length?a.join(" / "):"文件齊備"; }
    function visibilityHeaders(){let session;try{session=JSON.parse(localStorage.getItem("sakura_admin_session")||"null")}catch{}if(!session?.token)throw new Error("請先登入管理後台。");return {Authorization:"Bearer "+session.token};}
    async function apiGet(visibility=state.visibility,signal){ const r=await fetch("/admin-api/vendor-management?ts="+Date.now()+(visibility==="hidden"?"&visibility=hidden":""),{cache:"no-store",headers:visibility==="hidden"?visibilityHeaders():{},signal}); const j=await r.json(); if(!j.success) throw new Error(j.message || "讀取失敗"); return j; }
    async function post(action, data = {}, headers = {}) { const r = await fetch("/admin-api/vendor-management", { method:"POST", headers:{"content-type":"application/json",...headers}, body:JSON.stringify({ action, data }) }); const j = await r.json(); if (!j.success) throw new Error(j.message || "操作失敗"); return j; }
    function toBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result || "")); reader.onerror = reject; reader.readAsDataURL(file); }); }
    async function filePayload(file) { return { name:file.name, mimeType:file.type || "application/octet-stream", size:file.size, base64: await toBase64(file) }; }
    async function load(signal){ const version=++state.loadVersion, visibility=state.visibility; try{const data=await apiGet(visibility,signal);if(version!==state.loadVersion||visibility!==state.visibility)return;state.data=data;render();}catch(err){if(version!==state.loadVersion||visibility!==state.visibility)return;throw err;} }
    function setTab(tab){ const wasHidden=state.visibility==="hidden"; state.visibility="visible"; state.tab = tab; state.selectedVendorId = ""; $$(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab)); render(); if(wasHidden)load().catch(err=>toast(err.message)); }
    let vendorScrollSequence=0;
    function bindVendorScroll(){
      $$("#view .table-wrap").forEach(wrap=>{
        if(wrap.dataset.scrollBound)return;
        let left=wrap.id==="vendorTableScroll"?$("#vendorScrollLeft"):null;
        let right=wrap.id==="vendorTableScroll"?$("#vendorScrollRight"):null;
        if(!left||!right){
          if(!wrap.id)wrap.id="vendorTableScrollExtra"+(++vendorScrollSequence);
          const controls=document.createElement("div");
          controls.className="vendor-scroll-controls";
          controls.setAttribute("role","group");
          controls.setAttribute("aria-label","移動列表");
          left=document.createElement("button");right=document.createElement("button");
          for(const button of [left,right]){button.type="button";button.className="btn";button.setAttribute("aria-controls",wrap.id);button.disabled=true;}
          left.textContent="← 向左";right.textContent="向右 →";
          const hint=document.createElement("span");hint.className="hint";hint.textContent="移動列表查看其他欄位";
          controls.append(left,right,hint);wrap.before(controls);
        }
        wrap.dataset.scrollBound="1";
        const update=()=>{left.disabled=wrap.scrollLeft<=1;right.disabled=wrap.scrollLeft+wrap.clientWidth>=wrap.scrollWidth-1;};
        const move=direction=>wrap.scrollBy({left:direction*Math.max(180,Math.floor(wrap.clientWidth*.75)),behavior:"smooth"});
        left.onclick=()=>move(-1);right.onclick=()=>move(1);

    async function postLocation(action,data,headers,signal){
      let response;try{response=await fetch("/admin-api/vendor-management",{method:"POST",headers:{"content-type":"application/json",...headers},body:JSON.stringify({action,data}),signal});}catch(error){error.locationUnknown=true;throw error;}
      let json;try{json=await response.json();}catch(error){error.locationUnknown=true;throw error;}
      if(response.status>=500){const error=new Error("伺服器結果未確認");error.locationUnknown=true;throw error;}
      if(!json.success)throw new Error(json.message||"操作失敗");return json;
    }

    async function carouselFilePayload(file){ if(!file||!["image/jpeg","image/png","image/webp"].includes(file.type))throw new Error("DM 只支援 JPG、PNG、WebP。"); const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("圖片讀取失敗。"));img.src=URL.createObjectURL(file)}); const scale=Math.min(1,1600/Math.max(image.width,image.height));const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(image.src);const mime=file.type==="image/png"?"image/png":"image/jpeg";const base64=canvas.toDataURL(mime,mime==="image/png"?0.92:0.84);return{name:file.name,mimeType:mime,size:Math.floor(base64.length*0.75),base64}; }

    function openVendorSupplement(id){const v=(state.data.vendors||[]).find(item=>String(item.id)===String(id));if(!v||Number(v.is_hidden))return;const existing=supplementItems(v);supplementDraft={id:String(v.id),expected_updated_at:String(v.updated_at||""),request_id:crypto.randomUUID(),busy:false,confirmed:false};$("#vendorSupplementTarget").textContent=(v.name||"未命名廠商")+"（"+(v.vendor_code||v.id)+"）";const applicant=v.supplement?.applicant||{},uid=applicant.uid||v.submitted_by_line_user_id||"",verified=applicant.verified===true,hasUid=/^U[0-9a-f]{32}$/i.test(uid);$("#vendorSupplementApplicant").textContent=uid?"申請人 LINE UID："+uid:"此申請尚未綁定送件 LINE 帳號；補件要求仍可保存。";$("#vendorSupplementIdentityNote").textContent=(applicant.contactDifferent||(v.contact_line_user_id&&v.contact_line_user_id!==uid)?"聯絡人與申請人不同；本次只通知申請人。":"")+(verified?" 此申請人的 LINE 身分已驗證。":hasUid?" 未核對時只保存補件要求，不推送通知。":" 目前無有效申請人 UID，不推送通知。");$("#vendorSupplementIdentity").checked=false;$("#vendorSupplementIdentityLabel").hidden=verified||!hasUid;$("#vendorSupplementItems").innerHTML=supplementChoices.map(item=>'<label><input type="checkbox" value="'+esc(item)+'" '+(existing.includes(item)?"checked":"")+'><span>'+esc(item)+'</span></label>').join("");$("#vendorSupplementOther").value=existing.filter(item=>!supplementChoices.includes(item)).join(String.fromCharCode(10));$("#vendorSupplementNote").value=v.supplement?.note||"";$("#vendorSupplementResult").textContent="";$("#vendorSupplementCancel").textContent="取消";supplementBusy(false);$("#vendorSupplementDialog").showModal();}

    async function saveVendorSupplement(event){event.preventDefault();const draft=supplementDraft;if(!draft||draft.busy||draft.confirmed)return;const note=$("#vendorSupplementNote").value.trim();const items=[...new Set([...$("#vendorSupplementItems").querySelectorAll("input:checked")].map(input=>input.value).concat($("#vendorSupplementOther").value.split(String.fromCharCode(10))).map(item=>item.trim()).filter(Boolean))];const result=$("#vendorSupplementResult");if(!items.length||items.length>20||items.some(item=>item.length>200)){result.textContent="請選擇或填寫 1 至 20 個補件項目，每項最多 200 字。";return;}if(!note||note.length>2000){result.textContent="請填寫補件原因與說明，最多 2,000 字。";$("#vendorSupplementNote").focus();return;}if(!draft.expected_updated_at){result.textContent="缺少申請版本，請取消後重新載入，再要求補件。";return;}const payload={id:draft.id,status:"needs_supplement",review_note:note,supplement_items:items,request_id:draft.request_id,expected_updated_at:draft.expected_updated_at,reviewed_by:"福委會",confirm_applicant_identity:$("#vendorSupplementIdentity").checked===true};supplementBusy(true);state.loadVersion++;result.textContent="保存補件要求並通知中，請稍候…";let definitive=false;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch("/admin-api/vendor-management",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"vendor.status",data:payload}),signal:controller.signal});const json=await response.json();definitive=response.status<500;if(!json.success)throw new Error(json.message||"補件要求未完成，請確認後再試。");const data=json.data||{},saved=data.vendor||data;const v=(state.data.vendors||[]).find(item=>String(item.id)===draft.id);const supplement={...(v?.supplement||{}),...(saved.supplement||{}),items:saved.supplement?.items||saved.supplement_items||items,note:saved.supplement?.note||note,notification:saved.supplement?.notification||data.notification||{state:"unknown"}};if(v)Object.assign(v,saved,{id:draft.id,status:"needs_supplement",review_note:saved.review_note??note,supplement_items:supplement.items,supplement});state.loadVersion++;draft.confirmed=true;updateSupplementDisplay();result.textContent=supplementNotice(supplement.notification);$("#vendorSupplementCancel").textContent="完成";}catch(error){result.textContent=definitive?(error.message||"補件要求未完成，原資料已保留。") : "無法確認補件要求是否已保存或推送。請關閉後重新載入查看結果，勿重複送出；本次填寫內容仍保留於視窗。";if(!definitive)draft.confirmed=true;}finally{clearTimeout(timer);supplementBusy(false);if(draft.confirmed){for(const control of $("#vendorSupplementForm").querySelectorAll("input,textarea"))control.disabled=true;$("#vendorSupplementSubmit").disabled=true;$("#vendorSupplementSubmit").textContent=definitive?"已保存補件要求":"請先重新載入確認";}}}
    $("#vendorSupplementForm").onsubmit=saveVendorSupplement;
    $("#vendorSupplementCancel").onclick=()=>{if(!supplementDraft?.busy)$("#vendorSupplementDialog").close();};
    $("#vendorSupplementDialog").addEventListener("cancel",event=>{if(supplementDraft?.busy)event.preventDefault();});
    window.addEventListener("beforeunload",event=>{if(supplementDraft?.busy){event.preventDefault();event.returnValue="";}});
    new MutationObserver(refreshVendorScroll).observe($("#view"),{childList:true,subtree:true});
    $$(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
    setTab(state.tab);
    load().catch(err => $("#view").innerHTML = '<div class="empty">' + esc(err.message) + '</div>');
  </script>
