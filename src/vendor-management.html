<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>廠商管理 | SAKURA Welfare</title>
  <style>
    :root{--green:#06c755;--ink:#071226;--muted:#64748b;--line:#dbe3ee;--bg:#f5f7fa;--red:#df1124;--blue:#2563eb;--amber:#f59e0b}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:14px;overflow:hidden}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{height:100vh;padding:8px 18px 18px;display:flex;flex-direction:column;gap:10px}.hint,.muted{color:var(--muted);font-size:13px;line-height:1.55}.name{font-weight:900}.danger{color:#b91c1c;font-weight:900}
    .tabs{display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);min-height:42px}.tab{border:0;background:transparent;padding:9px 12px 10px;font-weight:900;color:#475569;border-bottom:3px solid transparent;white-space:nowrap}.tab.active{color:var(--red);border-bottom-color:var(--red);background:#ecfdf5}
    .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:800}.stat b{display:block;margin-top:3px;font-size:22px;line-height:1.1}
    #view{min-height:0;flex:1;overflow:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.panel-head,.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head{padding:12px 14px;border-bottom:1px solid var(--line)}.toolbar{margin-bottom:10px}.panel-title{font-size:16px;font-weight:950}.search{width:360px;max-width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff}.empty{padding:28px;text-align:center;color:var(--muted)}
    table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{background:#f8fafc;color:#475569;font-size:12px;font-weight:900;position:sticky;top:0;z-index:1}td{font-size:13px}.table-wrap{overflow:auto}.nowrap{white-space:nowrap}.wide{min-width:240px}.crm-row{cursor:pointer}.crm-row:hover{background:#f8fafc}.title-link{border:0;background:transparent;color:#0369a1;font-weight:950;padding:0;text-align:left}.code{color:#64748b;margin-top:3px}
    .badge{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:0 9px;font-size:12px;font-weight:900;background:#eef2ff;color:#3730a3}.pending,.pending_review{background:#fef3c7;color:#92400e}.approved,.active,.confirmed{background:#dcfce7;color:#166534}.rejected,.suspended,.inactive,.failed,.archived{background:#fee2e2;color:#991b1b}.draft,.visitor{background:#f1f5f9;color:#475569}.employee{background:#dbeafe;color:#1d4ed8}.new{background:#e0f2fe;color:#075985}
    .actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;font-weight:900;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.amber{background:#fff7ed;border-color:#fed7aa;color:#c2410c}.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
    .detail{display:grid;gap:10px}.detail-head{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:14px;align-items:start}.detail-name{font-size:20px;font-weight:950}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.info{border:1px solid #edf1f7;border-radius:8px;background:#fff;padding:12px}.info h3{margin:0 0 8px;font-size:14px;color:#b91c1c}.kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px;padding:4px 0}.kv span{color:#64748b;font-weight:850}.kv b{font-weight:650;word-break:break-word}.note{white-space:pre-wrap;line-height:1.7;color:#334155}
    .formline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px}.field label{display:block;margin-bottom:5px;font-size:12px;color:#475569;font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd8e6;border-radius:8px;padding:9px 10px;background:#fff;min-height:38px}.field textarea{min-height:96px;resize:vertical}.full{grid-column:1/-1}.form-section{border-top:1px solid var(--line);padding:14px}.form-section h3{margin:0 0 12px;font-size:15px;color:#b91c1c}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.rich-text{border:1px solid #cfd8e6;border-radius:8px;overflow:hidden;background:#fff}.rich-text:focus-within{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}.rich-toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:7px 8px;background:#f8fafc;border-bottom:1px solid #dbe3ee}.rich-toolbar button,.rich-toolbar select,.rich-toolbar input{min-height:30px;border:1px solid #cfd8e6;border-radius:5px;background:#fff;color:#334155;font-weight:800}.rich-toolbar button{min-width:30px;padding:0 8px}.rich-toolbar button:hover{background:#eef2ff}.rich-toolbar select{padding:0 6px}.rich-toolbar input[type=color]{width:32px;padding:2px}.rich-editor{min-height:170px;padding:12px;outline:0;line-height:1.75;color:#0f172a;overflow:auto}.rich-editor:empty:before{content:attr(data-placeholder);color:#94a3b8}.rich-editor h2{font-size:1.35em;margin:.55em 0}.rich-editor h3{font-size:1.15em;margin:.55em 0}.rich-editor p{margin:.45em 0}.rich-editor ul,.rich-editor ol{padding-left:1.6em}.rich-editor a{color:#2563eb;text-decoration:underline}.rich-help{padding:0 10px 9px;color:#64748b;font-size:12px}.reply{border:1px solid #bbf7d0;background:#ecfdf5;border-radius:8px;padding:12px;line-height:1.8;white-space:pre-wrap}.map-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:14px}.map-cell{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px;font-weight:900}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 12px 30px rgba(15,23,42,.22);display:none;z-index:20}.toast.show{display:block}
    @media(max-width:1260px){body{overflow:auto}.wrap{height:auto}.stats{grid-template-columns:repeat(3,1fr)}#view{overflow:visible}.detail-head{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}.formline,.form-grid{grid-template-columns:1fr 1fr}.map-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.stats,.detail-grid,.formline,.form-grid{grid-template-columns:1fr}.map-grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px 12px}.toolbar{display:grid}.search{width:100%}th,td{white-space:normal}.actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="vendor-review">廠商註冊審核</button>
      <button class="tab" data-tab="vendors">特約店家資料</button>
      <button class="tab" data-tab="offers">商品與優惠上架</button>
      <button class="tab" data-tab="offer-review">優惠審核待辦</button>
      <button class="tab" data-tab="store-map">全省特約店地圖</button>
      <button class="tab" data-tab="ocr">AI OCR 上架助手</button>
      <button class="tab" data-tab="redemptions">消費折抵</button>
      <button class="tab" data-tab="points">點數讀寫</button>
      <button class="tab" data-tab="ai">多語與 AI 詢問</button>
      <button class="tab" data-tab="knowledge">知識庫</button>
      <button class="tab" data-tab="reports">報表</button>
    </div>
    <section class="stats">
      <div class="stat"><span>廠商總數</span><b id="sVendorTotal">0</b></div>
      <div class="stat"><span>待審廠商</span><b id="sVendorPending">0</b></div>
      <div class="stat"><span>已核准廠商</span><b id="sVendorApproved">0</b></div>
      <div class="stat"><span>優惠總數</span><b id="sOfferTotal">0</b></div>
      <div class="stat"><span>待審優惠</span><b id="sOfferPending">0</b></div>
      <div class="stat"><span>折抵筆數</span><b id="sRedemptionTotal">0</b></div>
    </section>
    <section id="view"></section>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    const moduleTabMap = { "vendor-review":"vendor-review", vendors:"vendors", offers:"offers", ocr:"ocr", "offer-review":"offer-review", "store-map":"store-map", redemptions:"redemptions", points:"points", "mother-api":"points", ai:"ai", knowledge:"knowledge", reports:"reports" };
    const initialTab = moduleTabMap[new URL(location.href).searchParams.get("module") || "vendor-review"] || "vendor-review";
    const state = { tab: initialTab, q: "", selectedVendorId: "", knowledgeType: "text", data: { vendors: [], offers: [], locations: [], redemptions: [], summary: {} } };
    const cities = ["基隆市","台北市","新北市","桃園市","新竹縣市","苗栗縣","台中市","彰化縣","南投縣","雲林縣","嘉義縣市","台南市","高雄市","屏東縣","宜花東","澎湖/金門/馬祖"];
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
    const money = (v) => Number(v || 0).toLocaleString("zh-TW");
    const sortTime = (v) => Date.parse(v.created_at || v.updated_at || v.reviewed_at || "") || 0;
    function toast(text){ const el = $("#toast"); el.textContent = text; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2400); }
    function label(v){ return ({pending:"待審",approved:"已核准",suspended:"停權",rejected:"退回",draft:"草稿",pending_review:"待審",archived:"封存",active:"啟用",inactive:"停用",new:"新合作",renewing:"續約中",expired:"已到期",confirmed:"已確認",voided:"已作廢",employee:"員工",visitor:"用戶",committee:"委員",vendor:"廠商"}[v] || v || "未填"); }
    function badge(v){ return '<span class="badge ' + esc(v || "") + '">' + esc(label(v)) + '</span>'; }
    function kv(k,v){ return '<div class="kv"><span>' + esc(k) + '</span><b>' + (String(v || "").startsWith("<") ? v : esc(v || "未填")) + '</b></div>'; }
    function docLink(v){ return v ? '<a href="' + esc(v) + '" target="_blank" rel="noopener">查看</a>' : '<span class="danger">未附</span>'; }
    function missingDocs(v){ const a=[]; if(!v.business_license_url)a.push("缺營登"); if(!v.insurance_policy_no&&!v.insurance_file_url)a.push("缺保險"); if(!v.contract_end)a.push("合約未填"); return a.length?a.join(" / "):"文件齊備"; }
    async function apiGet(){ const r=await fetch("/admin-api/vendor-management?ts="+Date.now(),{cache:"no-store"}); const j=await r.json(); if(!j.success) throw new Error(j.message || "讀取失敗"); return j; }
    async function post(action, data = {}) { const r = await fetch("/admin-api/vendor-management", { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ action, data }) }); const j = await r.json(); if (!j.success) throw new Error(j.message || "操作失敗"); return j; }
    function toBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result || "")); reader.onerror = reject; reader.readAsDataURL(file); }); }
    async function filePayload(file) { return { name:file.name, mimeType:file.type || "application/octet-stream", size:file.size, base64: await toBase64(file) }; }
    async function load(){ state.data = await apiGet(); (state.data.vendors || []).forEach(v => { v.id = String(v.id); }); render(); bindRichTextEditors(); }
    function setTab(tab){ state.tab = tab; state.selectedVendorId = ""; $$(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab)); render(); }
    function bindSearch(){ const s = $("#searchBox"); if(s) s.oninput = () => { state.q = s.value.trim().toLowerCase(); render(); }; }
    function applySearch(list){ if(!state.q) return list; return list.filter(x => JSON.stringify(x).toLowerCase().includes(state.q)); }
    function sortedVendors(){ return applySearch([...(state.data.vendors || [])].sort((a,b)=>sortTime(b)-sortTime(a))); }
    function sortedOffers(){ return applySearch([...(state.data.offers || [])].sort((a,b)=>sortTime(b)-sortTime(a))); }
    function searchBox(ph){ return '<input id="searchBox" class="search" value="' + esc(state.q) + '" placeholder="' + esc(ph) + '">'; }
    function vendorRow(v){ return '<tr><td><button class="title-link" data-open-vendor="' + esc(v.id) + '">' + esc(v.name || "未命名廠商") + '</button><div class="code">' + esc(v.vendor_code || v.id || "") + '</div><div class="muted">申請：' + esc(v.created_at || v.updated_at || "") + '</div></td><td>' + esc(v.category || "未分類") + '</td><td>' + esc(v.tax_id || "未填") + '</td><td>' + esc(v.contact_name || v.owner_name || "未填") + '</td><td>' + esc(v.phone || "未填") + '</td><td class="wide">' + esc(v.contact_line_user_id || v.line_oa_id || "未填") + '</td><td>' + badge(v.status) + '</td><td>' + badge(v.cooperation_status || "new") + '</td><td class="wide">' + esc(missingDocs(v)) + '</td><td>' + (v.location_count || 0) + ' 地點 / ' + (v.offer_count || 0) + ' 優惠</td><td class="actions nowrap"><button class="btn blue" data-open-vendor="' + esc(v.id) + '">編輯</button><button class="btn green" data-vendor-status="approved" data-id="' + esc(v.id) + '">核准</button><button class="btn amber" data-vendor-status="rejected" data-id="' + esc(v.id) + '">退回</button><button class="btn red" data-vendor-status="suspended" data-id="' + esc(v.id) + '">停權</button></td></tr>'; }
    function vendorList(title, note, vendors){ const rows = vendors.length ? vendors.map(vendorRow).join("") : '<tr><td colspan="11" class="empty">目前沒有廠商資料。</td></tr>'; return '<div class="toolbar"><div><div class="panel-title">' + esc(title) + '</div><div class="hint">' + esc(note) + '</div></div><div class="actions">' + searchBox("搜尋廠商、統編、聯絡人、LINE、狀態") + '<a class="btn green" href="/vendor-apply" target="_blank" rel="noopener">廠商申請表</a></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>廠商</th><th>分類</th><th>統編</th><th>聯絡人</th><th>電話</th><th>LINE</th><th>審核</th><th>合作</th><th>文件</th><th>資料</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>'; }
    function input(name,label,value,type){ return '<div class="field"><label>' + esc(label) + '</label><input name="' + esc(name) + '" type="' + esc(type || "text") + '" value="' + esc(value || "") + '"></div>'; }
    function fileInput(fileName,urlName,label,currentUrl){ return '<div class="field"><label>' + esc(label) + '</label><input name="' + esc(fileName) + '" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"><input name="' + esc(urlName) + '" type="hidden" value="' + esc(currentUrl || "") + '"><div class="muted">' + (currentUrl ? '<a href="' + esc(currentUrl) + '" target="_blank" rel="noopener">目前檔案</a>，重新選擇才會覆蓋。' : '尚未上傳，請直接選擇檔案。') + '</div></div>'; }
    function textarea(name,label,value){ return name === "discount_policy" ? richText(name,label,value) : '<div class="field full"><label>' + esc(label) + '</label><textarea name="' + esc(name) + '">' + esc(value || "") + '</textarea></div>'; }
    function richText(name,label,value){ return '<div class="field full"><label>' + esc(label) + '</label><input type="hidden" name="' + esc(name) + '" value="' + esc(value || "") + '" data-rich-value><div class="rich-text"><div class="rich-toolbar" role="toolbar" aria-label="優惠政策編輯工具"><select data-rich-format aria-label="段落樣式"><option value="P">內文</option><option value="H2">大標題</option><option value="H3">小標題</option></select><button type="button" data-rich-command="bold" title="粗體"><b>B</b></button><button type="button" data-rich-command="italic" title="斜體"><i>I</i></button><button type="button" data-rich-command="underline" title="底線"><u>U</u></button><button type="button" data-rich-command="insertUnorderedList" title="項目清單">• 清單</button><button type="button" data-rich-command="insertOrderedList" title="編號清單">1. 清單</button><input type="color" data-rich-color value="#111827" title="文字色彩" aria-label="文字色彩"><button type="button" data-rich-link title="插入連結">連結</button><button type="button" data-rich-clear title="清除選取文字格式">清除格式</button></div><div class="rich-editor" contenteditable="true" data-rich-editor data-placeholder="輸入優惠內容；可直接按 Enter 換行、用工具列設定標題或清單。"></div><div class="rich-help">支援段落、標題、粗體、清單、文字色彩與連結；貼上內容會保留純文字，避免帶入外部格式。</div></div></div>'; }
    function sanitizeRichText(value){ const source=String(value||""); const doc=new DOMParser().parseFromString(source,"text/html"); const out=document.createElement("div"); const allowed=new Set(["P","BR","DIV","H2","H3","STRONG","B","EM","I","U","UL","OL","LI","A","SPAN"]); const blocked=new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","SVG","MATH"]); const clean=node=>{ if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent||""); if(node.nodeType!==Node.ELEMENT_NODE)return null; if(blocked.has(node.tagName))return null; const box=allowed.has(node.tagName)?document.createElement(node.tagName.toLowerCase()):document.createDocumentFragment(); if(node.tagName==="A"&&box.nodeType===Node.ELEMENT_NODE){const href=node.getAttribute("href")||"";if(/^(https?:|mailto:|tel:)/i.test(href)){box.setAttribute("href",href);box.setAttribute("target","_blank");box.setAttribute("rel","noopener noreferrer");}} if(node.tagName==="SPAN"&&box.nodeType===Node.ELEMENT_NODE&&node.style.color)box.style.color=node.style.color; [...node.childNodes].forEach(child=>{const safe=clean(child);if(safe)box.appendChild(safe);}); return box; }; [...doc.body.childNodes].forEach(node=>{const safe=clean(node);if(safe)out.appendChild(safe);}); if(!out.innerHTML.trim()&&source.trim())out.textContent=source; return out.innerHTML.split(String.fromCharCode(10)).join("<br>"); }
    function bindRichTextEditors(){ $$('[data-rich-editor]').forEach(editor=>{if(editor.dataset.richBound)return;editor.dataset.richBound="1";const field=editor.closest('.field');const hidden=field.querySelector('[data-rich-value]');const sync=()=>{hidden.value=sanitizeRichText(editor.innerHTML);}; editor.innerHTML=sanitizeRichText(hidden.value); sync(); editor.addEventListener('input',sync); editor.addEventListener('blur',sync); editor.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));sync();}); field.querySelectorAll('[data-rich-command]').forEach(button=>button.onclick=()=>{editor.focus();document.execCommand(button.dataset.richCommand,false,null);sync();}); const format=field.querySelector('[data-rich-format]');format.onchange=()=>{editor.focus();document.execCommand('formatBlock',false,format.value);sync();}; const color=field.querySelector('[data-rich-color]');color.oninput=()=>{editor.focus();document.execCommand('foreColor',false,color.value);sync();}; field.querySelector('[data-rich-link]').onclick=()=>{const url=prompt('請輸入連結網址（https://、mailto: 或 tel:）');if(!url)return;if(!/^(https?:|mailto:|tel:)/i.test(url)){toast('連結需以 https://、mailto: 或 tel: 開頭');return;}editor.focus();document.execCommand('createLink',false,url);sync();}; field.querySelector('[data-rich-clear]').onclick=()=>{editor.focus();document.execCommand('removeFormat');sync();}; }); }
    function select(name,label,value,items){ return '<div class="field"><label>' + esc(label) + '</label><select name="' + esc(name) + '">' + items.map(([k,t]) => '<option value="' + esc(k) + '" ' + (String(value || "") === k ? "selected" : "") + '>' + esc(t) + '</option>').join("") + '</select></div>'; }
    function vendorDetail(v){ return '<form class="panel" data-form="vendor-edit"><div class="panel-head"><div><button class="btn" id="backToVendorList" type="button">返回清單</button><div class="panel-title" style="margin-top:8px">編輯廠商申請表</div><div class="hint">' + esc(v.vendor_code || v.id || "") + ' / 申請時間：' + esc(v.created_at || v.updated_at || "未記錄") + '</div></div><div class="actions"><button class="btn green" type="submit">儲存</button><button class="btn green" type="button" data-vendor-status="approved" data-id="' + esc(v.id) + '">核准</button><button class="btn amber" type="button" data-vendor-status="rejected" data-id="' + esc(v.id) + '">退回</button><button class="btn red" type="button" data-vendor-status="suspended" data-id="' + esc(v.id) + '">停權</button></div></div><input type="hidden" name="id" value="' + esc(v.id) + '"><div class="form-section"><h3>1. 公司登記</h3><div class="form-grid">' + input("name","店家/品牌名稱",v.name) + input("vendor_code","廠商編號",v.vendor_code) + input("legal_name","公司登記名稱",v.legal_name) + input("tax_id","統一編號",v.tax_id) + input("owner_name","負責人",v.owner_name) + input("invoice_title","發票抬頭",v.invoice_title) + input("company_address","登記地址",v.company_address) + select("category","分類",v.category,[["食","食"],["衣","衣"],["住","住"],["行","行"],["育","育"],["樂","樂"],["醫療","醫療"],["其他","其他"]]) + select("status","審核狀態",v.status,[["pending","待審"],["approved","已核准"],["rejected","退回"],["suspended","停權"]]) + select("cooperation_status","合作狀態",v.cooperation_status || "new",[["new","新合作"],["active","啟用"],["renewing","續約中"],["expired","已到期"],["inactive","停用"]]) + input("tags","標籤",v.tags) + '</div></div><div class="form-section"><h3>2. 聯絡與帳號</h3><div class="form-grid">' + input("contact_name","聯絡人",v.contact_name) + input("phone","電話",v.phone) + input("email","Email",v.email,"email") + input("contact_line_user_id","聯絡人 LINE ID",v.contact_line_user_id) + input("line_oa_id","廠商 LINE OA / 帳號",v.line_oa_id) + input("submitted_by_line_user_id","送件 LINE User ID",v.submitted_by_line_user_id) + '</div></div><div class="form-section"><h3>3. 證照、保險與合約</h3><div class="form-grid">' + fileInput("business_license_file","business_license_url","營業登記 / 證照檔案",v.business_license_url) + input("food_registration_no","食品業者登錄字號",v.food_registration_no) + fileInput("food_registration_file","food_registration_url","食品業者登錄文件",v.food_registration_url) + input("insurance_policy_no","保險證號",v.insurance_policy_no) + fileInput("insurance_file","insurance_file_url","保險文件",v.insurance_file_url) + input("contract_start","合約起日",v.contract_start,"date") + input("contract_end","合約迄日",v.contract_end,"date") + '</div></div><div class="form-section"><h3>4. 對外資訊與優惠政策</h3><div class="form-grid">' + input("website_url","網站",v.website_url,"url") + input("facebook_url","Facebook",v.facebook_url,"url") + input("logo_url","Logo URL",v.logo_url,"url") + input("cover_image_url","封面 URL",v.cover_image_url,"url") + textarea("discount_policy","優惠政策",v.discount_policy) + '</div></div><div class="form-section"><h3>5. AI 初審與委員備註</h3><div class="form-grid">' + textarea("ai_review_summary","AI 初審摘要",v.ai_review_summary) + textarea("review_note","委員審核備註",v.review_note) + '</div></div></form>'; }
    function tablePanel(title,note,head,body){ return '<div class="panel"><div class="panel-head"><div><div class="panel-title">' + title + '</div><div class="hint">' + note + '</div></div></div><div class="table-wrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>'; }
    function offerRows(list){ if(!list.length)return '<tr><td colspan="10" class="empty">目前沒有優惠資料。</td></tr>'; return list.map(o => '<tr><td><div class="name">' + esc(o.title) + '</div><div class="muted">' + esc(o.vendor_name || "") + '</div></td><td>' + esc(o.category || "") + '</td><td class="nowrap">$' + money(o.original_price) + '</td><td class="nowrap">$' + money(o.employee_price) + '</td><td class="nowrap">$' + money(o.visitor_price) + '</td><td>' + esc(o.redemption_method || "qr_code") + '</td><td>' + (Number(o.qr_enabled) ? "啟用" : "停用") + '</td><td>' + badge(o.status) + '</td><td class="wide">' + esc(o.review_note || o.usage_limit || "") + '</td><td class="actions"><button class="btn green" data-offer-status="approved" data-id="' + esc(o.id) + '">核准</button><button class="btn amber" data-offer-status="rejected" data-id="' + esc(o.id) + '">退回</button></td></tr>').join(""); }
    function locationRows(list){ if(!list.length)return '<tr><td colspan="8" class="empty">目前沒有地點資料。</td></tr>'; return list.map(l => '<tr><td><div class="name">' + esc(l.branch_name || "未命名分店") + '</div></td><td>' + esc(l.city || "") + '</td><td>' + esc(l.district || "") + '</td><td class="wide">' + esc(l.address || "") + '</td><td>' + esc(l.service_area || "") + '</td><td>' + esc(l.business_hours || "") + '</td><td>' + esc(l.contact_phone || "") + '</td><td>' + (l.google_maps_url ? '<a href="' + esc(l.google_maps_url) + '" target="_blank">地圖</a>' : "") + '</td></tr>').join(""); }
    function redemptionRows(list){ if(!list.length)return '<tr><td colspan="8" class="empty">目前沒有折抵紀錄。</td></tr>'; return list.map(r => '<tr><td><div class="name">' + esc(r.offer_title || r.offer_id) + '</div><div class="muted">' + esc(r.vendor_name || r.vendor_id) + '</div></td><td>' + badge(r.member_type) + '</td><td>' + esc(r.line_user_id) + '</td><td>$' + money(r.original_price) + '</td><td>$' + money(r.payable_price) + '</td><td>$' + money(r.discount_amount) + '</td><td>' + badge(r.status) + '</td><td>' + esc(r.redeemed_at || r.created_at || "") + '</td></tr>').join(""); }
    function vendorOptions(){ return (state.data.vendors || []).map(v => '<option value="' + esc(v.id) + '">' + esc(v.name) + '</option>').join(""); }
    function knowledgeFields(){ if(state.knowledgeType === "url") return '<div class="field full"><label>來源網址</label><input name="source_url" type="url" placeholder="https://www.sakura.com.tw/..."></div><div class="field full"><label>網址摘要 / AI 可讀內容</label><textarea name="body" placeholder="貼上此網址的重點摘要，方便 AI 直接引用。"></textarea></div>'; if(state.knowledgeType === "file") return '<div class="field full"><label>上傳檔案</label><input name="knowledge_file" type="file" accept=".pdf,.doc,.docx,.txt,.md,.csv,.xls,.xlsx,.jpg,.jpeg,.png"></div><div class="field full"><label>檔案摘要 / OCR 文字</label><textarea name="body" placeholder="可貼上檔案重點、OCR 文字或索引說明；若留空，系統仍會保存檔案供後續補標。"></textarea></div>'; return '<div class="field full"><label>文字內容</label><textarea name="body" placeholder="規則、FAQ、店家資料、QR 折抵 SOP。"></textarea></div>'; }
    function render(){ const s=state.data.summary||{}; $("#sVendorTotal").textContent=s.vendor_total||0; $("#sVendorPending").textContent=s.vendor_pending||0; $("#sVendorApproved").textContent=s.vendor_approved||0; $("#sOfferTotal").textContent=s.offer_total||0; $("#sOfferPending").textContent=s.offer_pending||0; $("#sRedemptionTotal").textContent=s.redemption_total||0; if(state.tab==="vendor-review"||state.tab==="vendors"){ const vendor=state.selectedVendorId?(state.data.vendors||[]).find(v=>v.id===state.selectedVendorId):null; $("#view").innerHTML=vendor?vendorDetail(vendor):vendorList(state.tab==="vendor-review"?"廠商註冊審核清單":"特約店家資料",state.tab==="vendor-review"?"像 CRM 一樣一行一家；新申請依建立時間往上排，點入後查看完整申請表。":"一行一家特約店，點入後查看公司資料、地點、優惠與審核紀錄。",sortedVendors()); } else if(state.tab==="offers"||state.tab==="offer-review"){ $("#view").innerHTML='<div class="toolbar"><div><div class="panel-title">'+(state.tab==="offer-review"?"優惠審核待辦":"商品與優惠上架")+'</div><div class="hint">員工價、訪客價、QR 核銷與上架狀態；訪客價不得低於員工價。</div></div>'+searchBox("搜尋優惠、廠商、狀態")+'</div>'+tablePanel(state.tab==="offer-review"?"優惠審核待辦":"商品與優惠上架","福委會只審核優惠揭露與身分折抵規則，不介入廠商日常營運。",'<tr><th>優惠</th><th>分類</th><th>原價</th><th>員工價</th><th>訪客價</th><th>核銷</th><th>QR</th><th>狀態</th><th>備註/限制</th><th>操作</th></tr>',offerRows(sortedOffers())); } else if(state.tab==="store-map"){ const loc=applySearch(state.data.locations||[]); $("#view").innerHTML='<div class="toolbar"><div><div class="panel-title">全省特約店地圖</div><div class="hint">支援全台與離島分布，可搭配 LINE Flex 縣市入口。</div></div>'+searchBox("搜尋縣市、區域、分店")+'</div>'+tablePanel("特約店地點列表","全台與離島都納入，不只廠區周邊。",'<tr><th>分店</th><th>縣市</th><th>區域</th><th>地址</th><th>服務區</th><th>營業</th><th>電話</th><th>Google</th></tr>',locationRows(loc))+'<div class="map-grid">'+cities.map(c=>'<div class="map-cell">'+c+'<div class="muted">'+loc.filter(l=>String(l.city||l.service_area||l.island_area||"").includes(c.replace("縣市",""))).length+' 地點</div></div>').join("")+'</div>'; } else if(state.tab==="ocr"){ $("#view").innerHTML='<div class="panel"><div class="panel-head"><div><div class="panel-title">AI OCR 上架助手</div><div class="hint">廠商可拍照或上傳菜單，AI OCR 後轉成優惠草稿。</div></div></div><form class="formline" data-form="ocr"><div class="field"><label>廠商</label><select name="vendor_id">'+vendorOptions()+'</select></div><div class="field full"><label>貼上菜單、價目表或 OCR 文字</label><textarea name="text" placeholder="例：套餐 A 原價 100，櫻花員工 80，訪客 100。"></textarea></div><button class="btn green" type="submit">產生優惠草稿</button><div class="reply full" id="ocrResult">AI 會整理商品名稱、原價、員工價、訪客價、使用限制與審核備註。</div></form></div>'; } else if(state.tab==="redemptions"){ $("#view").innerHTML=tablePanel("消費折抵紀錄","員工與用戶身分由 QR Code 判定，系統阻擋訪客價低於員工價。",'<tr><th>優惠</th><th>身分</th><th>LINE</th><th>原價</th><th>實付</th><th>折抵</th><th>狀態</th><th>時間</th></tr>',redemptionRows(state.data.redemptions||[])); } else if(state.tab==="points"){ $("#view").innerHTML='<div class="panel"><div class="panel-head"><div><div class="panel-title">母站點數 API</div><div class="hint">點數由母站讀寫，子站只串接查詢與新增異動。</div></div></div><form class="formline" data-form="points"><div class="field"><label>LINE User ID</label><input name="LINE_user_id"></div><div class="field"><label>母站 shop_id</label><input name="shop_id" type="number"></div><div class="field"><label>點數類型</label><select name="point_type"><option value="system_point">點數</option><option value="gift_money">購物金</option></select></div><button class="btn" data-point-action="query" type="button">查詢</button><button class="btn green" data-point-action="insert" type="button">新增異動</button><pre id="pointResult" class="reply full">尚未查詢</pre></form></div>'; } else if(state.tab==="ai"){ $("#view").innerHTML='<div class="panel"><div class="panel-head"><div><div class="panel-title">多語與 AI 詢問</div><div class="hint">支援外籍員工：繁中、印尼文、泰文自動翻譯與回答。</div></div></div><form class="formline" data-form="ai"><div class="field"><label>LINE User ID</label><input name="LINE_user_id"></div><div class="field"><label>語言</label><select name="language"><option value="">自動判斷</option><option value="zh-TW">繁體中文</option><option value="id">印尼文</option><option value="th">泰文</option></select></div><div class="field full"><label>問題</label><textarea name="question" placeholder="例：Saya ingin tahu cara menggunakan diskon karyawan"></textarea></div><button class="btn green" type="submit">取得 AI 回覆</button><div class="reply full" id="aiAnswer">尚未詢問</div></form></div>'; } else if(state.tab==="knowledge"){ $("#view").innerHTML='<div class="panel"><div class="panel-head"><div><div class="panel-title">知識庫</div><div class="hint">提供 AI 回覆使用；欄位會依文字、網址、檔案自動切換。</div></div></div><form class="formline" data-form="knowledge"><div class="field"><label>標題</label><input name="title" placeholder="員工優惠使用規則"></div><div class="field"><label>語言</label><select name="language"><option value="zh-TW">繁中</option><option value="id">印尼文</option><option value="th">泰文</option></select></div><div class="field"><label>類型</label><select name="asset_type" id="knowledgeType"><option value="text" '+(state.knowledgeType==="text"?"selected":"")+'>文字</option><option value="url" '+(state.knowledgeType==="url"?"selected":"")+'>網址</option><option value="file" '+(state.knowledgeType==="file"?"selected":"")+'>檔案</option></select></div>'+knowledgeFields()+'<button class="btn green" type="submit">儲存知識庫</button></form></div>'; } else { $("#view").innerHTML=tablePanel("營運報表","日、週、月資料後續可接圖表。",'<tr><th>項目</th><th>數值</th><th>福委會觀察</th></tr>','<tr><td>折抵筆數</td><td>$'+money(s.redemption_total)+'</td><td>觀察員工實際使用率</td></tr><tr><td>實收金額</td><td>$'+money(s.payable_total)+'</td><td>廠商營運參考</td></tr><tr><td>折抵金額</td><td>$'+money(s.discount_total)+'</td><td>福利價值量化</td></tr><tr><td>地點總數</td><td>'+money(s.location_total)+'</td><td>全台與離島覆蓋率</td></tr>'); } bind(); bindSearch(); }
    function bind(){ $$("[data-open-vendor]").forEach(el=>el.onclick=e=>{e.stopPropagation();state.selectedVendorId=el.dataset.openVendor;render();}); const back=$("#backToVendorList"); if(back) back.onclick=()=>{state.selectedVendorId="";render();}; $$("[data-vendor-status]").forEach(b=>b.onclick=async()=>{await post("vendor.status",{id:b.dataset.id,status:b.dataset.vendorStatus,reviewed_by:"福委會"});toast("廠商狀態已更新");await load();}); $$('[data-form="vendor-edit"]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(f));for(const name of ["business_license_file","food_registration_file","insurance_file"]){const file=f.querySelector('[name="'+name+'"]')?.files?.[0];if(file){if(file.size>10*1024*1024)throw new Error("檔案不可超過 10MB。");data[name]=await filePayload(file);}else{delete data[name];}}await post("vendor.save",data);toast("廠商資料已儲存");await load();state.selectedVendorId=data.id;render();}catch(err){toast(err.message);}}); $$("[data-offer-status]").forEach(b=>b.onclick=async()=>{await post("offer.status",{id:b.dataset.id,status:b.dataset.offerStatus,approved_by:"福委會"});toast("優惠狀態已更新");await load();}); $$('[data-form="ocr"]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{const j=await post("ocr.draft",Object.fromEntries(new FormData(f)));$("#ocrResult").textContent="草稿："+j.data.title+"\\n原價 "+money(j.data.original_price)+" / 員工價 "+money(j.data.employee_price)+" / 訪客價 "+money(j.data.visitor_price)+"\\n"+(j.data.usage_limit||"");toast("已產生優惠草稿");}catch(err){toast(err.message);}}); $$('[data-form="ai"]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{const j=await post("ai.ask",Object.fromEntries(new FormData(f)));$("#aiAnswer").textContent=j.data.answer;toast("AI 已回覆");}catch(err){toast(err.message);}}); const kt=$("#knowledgeType"); if(kt) kt.onchange=()=>{state.knowledgeType=kt.value;render();}; $$('[data-form="knowledge"]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(f));if(data.asset_type==="url"&&!data.source_url)throw new Error("請填寫來源網址。");if(data.asset_type==="file"){const file=f.querySelector('[name="knowledge_file"]')?.files?.[0];if(!file)throw new Error("請選擇要上傳的檔案。");if(file.size>10*1024*1024)throw new Error("檔案不可超過 10MB。");data.file=await filePayload(file);delete data.knowledge_file;}if(data.asset_type==="text"&&!data.body)throw new Error("請填寫文字內容。");await post("knowledge.save",data);f.reset();state.knowledgeType="text";toast("知識庫已儲存");}catch(err){toast(err.message);}}); $$("[data-point-action]").forEach(b=>b.onclick=async()=>{const data=Object.fromEntries(new FormData(b.closest("form")));try{const j=await post(b.dataset.pointAction==="query"?"points.query":"points.insert",b.dataset.pointAction==="query"?data:{...data,event_name:"福委會福利點數",event_content:"子站手動點數異動",get_point:1});$("#pointResult").textContent=JSON.stringify(j,null,2);}catch(err){$("#pointResult").textContent=err.message;}}); }
    new MutationObserver(() => bindRichTextEditors()).observe($("#view"), { childList:true, subtree:true });
    $$(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
    setTab(state.tab);
    load().catch(err => $("#view").innerHTML = '<div class="empty">' + esc(err.message) + '</div>');
  </script>
