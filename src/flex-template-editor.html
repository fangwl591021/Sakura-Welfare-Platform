<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flex Message 模板 | SAKURA Welfare</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --panel: #fff;
      --line: #dce5ef;
      --ink: #071226;
      --muted: #64748b;
      --green: #06c755;
      --green-dark: #05a948;
      --red: #df1124;
      --blue: #2563eb;
      --soft: #f8fafc;
      --nav: #2f3746;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 14px;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { height: 100vh; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
    .side {
      min-height: 0;
      background: #fff;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }
    .brand {
      height: 76px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-weight: 900;
      display: grid;
      place-items: center;
    }
    .brand strong { display: block; font-size: 17px; line-height: 1.25; }
    .brand span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .nav-btn {
      width: 100%;
      min-height: 78px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      color: #334155;
      display: grid;
      grid-template-columns: 42px 1fr 18px;
      align-items: center;
      gap: 8px;
      padding: 0 22px;
      text-align: left;
      font-weight: 900;
      font-size: 17px;
    }
    .nav-btn:hover { background: #f8fafc; }
    .nav-btn.active { color: var(--green); background: #ecfdf5; }
    .ico {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      color: #64748b;
      font-size: 15px;
      font-weight: 900;
    }
    .nav-btn.active .ico { background: #d1fae5; color: #047857; }
    .folder-panel {
      display: none;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
      padding: 10px 0 12px;
    }
    .folder-panel.open { display: block; }
    .folder-head {
      width: calc(100% - 28px);
      margin: 0 14px 8px;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: #f8fafc;
      color: #334155;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      text-align: left;
      font-weight: 900;
    }
    .folder-head:hover { background: #eef2f7; }
    .folder-projects {
      display: grid;
      gap: 6px;
      padding: 0 14px;
      max-height: 310px;
      overflow: auto;
    }
    .folder-project {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      text-align: left;
    }
    .folder-project:hover { border-color: var(--green); background: #f0fdf4; }
    .folder-project strong { display: block; font-size: 14px; }
    .folder-project span { display: block; color: #64748b; font-size: 11px; margin-top: 2px; }
    .folder-project b { color: var(--green); font-size: 12px; }
    .folder-empty {
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #94a3b8;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .top {
      height: 86px;
      padding: 18px 26px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    h1 { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: 0; }
    .sub { color: var(--muted); margin-top: 6px; font-size: 13px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      min-height: 39px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 0 13px;
      font-weight: 900;
      white-space: nowrap;
    }
    .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.green:hover { background: var(--green-dark); }
    .btn.red { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
    .content { min-height: 0; flex: 1; overflow: hidden; }
    .view { height: 100%; display: none; }
    .view.active { display: block; }
    .library {
      height: 100%;
      padding: 32px;
      overflow: auto;
    }
    .library-head { text-align: center; margin: 10px 0 36px; }
    .library-head h2 { margin: 0; font-size: 34px; line-height: 1.1; }
    .library-head p { margin: 10px 0 0; color: #94a3b8; font-weight: 900; }
    .template-grid {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
    }
    .saved-wrap { max-width: 980px; margin: 34px auto 0; }
    .saved-title { display: flex; align-items: center; justify-content: space-between; color: #64748b; font-size: 13px; font-weight: 900; margin-bottom: 12px; }
    .saved-list { display: grid; gap: 10px; }
    .folder-project {
      width: 100%;
      min-height: 64px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      text-align: left;
    }
    .folder-project strong { display: block; font-size: 15px; }
    .folder-project span { display: block; color: #64748b; font-size: 12px; margin-top: 3px; }
    .folder-project b { color: var(--green); font-size: 13px; }
    .empty-saved { border: 1px dashed #cbd5e1; border-radius: 10px; padding: 16px; color: #94a3b8; background: #fff; }
    .template-card {
      min-height: 280px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, .08);
      transition: .18s;
    }
    .template-card:hover { border-color: var(--green); transform: translateY(-3px); }
    .template-icon {
      width: 78px;
      height: 78px;
      border-radius: 18px;
      background: #f1f5f9;
      color: var(--green);
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 24px;
    }
    .template-card h3 { margin: 0; font-size: 23px; }
    .template-card p { margin: 14px 0 24px; color: #8090a8; line-height: 1.7; font-weight: 800; }
    .template-card span { color: var(--green); border-bottom: 2px solid var(--green); font-weight: 900; }
    .files {
      height: 100%;
      padding: 28px 32px;
      overflow: auto;
    }
    .files-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }
    .files-head h2 { margin: 0; font-size: 26px; }
    .files-head p { margin: 6px 0 0; color: var(--muted); }
    .file-tools {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .file-search {
      width: 260px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      outline: 0;
    }
    .file-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .file-table th,
    .file-table td {
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      text-align: left;
      vertical-align: middle;
    }
    .file-table th {
      background: #f8fafc;
      color: #475569;
      font-size: 13px;
      font-weight: 900;
    }
    .file-title { color: #0369a1; font-weight: 900; }
    .file-meta { color: #64748b; font-size: 12px; margin-top: 4px; }
    .file-open {
      border: 1px solid var(--green);
      border-radius: 8px;
      background: #ecfdf5;
      color: #047857;
      min-height: 34px;
      padding: 0 12px;
      font-weight: 900;
    }
    .file-empty {
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      background: #fff;
      color: #64748b;
      padding: 24px;
      line-height: 1.7;
    }
    .editor {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(340px, 430px) minmax(480px, 1fr);
      overflow: hidden;
    }
    .preview-pane {
      min-height: 0;
      overflow: auto;
      background: #e8edf4;
      border-right: 1px solid var(--line);
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .preview-label { color: #64748b; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .phone {
      width: 330px;
      min-height: 620px;
      border: 7px solid #172033;
      border-radius: 35px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 18px 35px rgba(15, 23, 42, .18);
    }
    .phone img { width: 100%; display: block; object-fit: cover; }
    .phone-video {
      position: relative;
      height: 190px;
      background: #0f172a;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .play { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.75); display: grid; place-items: center; color: #111827; font-weight: 900; }
    .phone-body { padding: 18px; }
    .phone-title { font-size: 18px; font-weight: 900; line-height: 1.35; margin-bottom: 9px; white-space: pre-wrap; }
    .phone-text { color: #334155; line-height: 1.65; white-space: pre-wrap; }
    .phone-actions { display: grid; gap: 9px; padding: 0 14px 16px; }
    .phone-action { border-radius: 7px; background: #111; color: #fff; padding: 12px; text-align: center; font-weight: 900; }
    .product-list { display: grid; gap: 8px; padding: 12px; }
    .product-row { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; border: 1px solid #edf2f7; border-radius: 10px; padding: 8px; }
    .product-row img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #e2e8f0; }
    .product-row strong { display: block; font-size: 13px; }
    .product-row span { color: #dc2626; font-weight: 900; font-size: 12px; }
    .form-pane { min-width: 0; min-height: 0; overflow: auto; background: #fff; padding: 28px 34px; }
    .form-title { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 22px; }
    .form-title h2 { margin: 0; font-size: 27px; line-height: 1.25; }
    .form-title p { margin: 8px 0 0; color: #94a3b8; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .section { border-top: 1px solid var(--line); padding-top: 22px; margin-top: 22px; }
    .section h3 { margin: 0 0 16px; display: flex; align-items: center; gap: 10px; color: var(--green); font-size: 16px; }
    .num { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .field { margin-bottom: 14px; }
    .field.wide { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 6px; color: #64748b; font-size: 12px; font-weight: 900; }
    .field input, .field textarea, .field select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }
    .field textarea { min-height: 148px; resize: vertical; line-height: 1.55; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(6,199,85,.12); }
    .json-box { width: 100%; min-height: 190px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5; background: #fbfdff; }
    .toast {
      display: none;
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #111827;
      color: #fff;
      border-radius: 8px;
      padding: 12px 15px;
      font-weight: 900;
      z-index: 20;
      box-shadow: 0 14px 30px rgba(15,23,42,.25);
    }
    .toast.show { display: block; }
    @media (max-width: 1100px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; grid-template-columns: 1fr; }
      .side { position: sticky; top: 0; z-index: 4; }
      .editor { grid-template-columns: 1fr; }
      .template-grid { grid-template-columns: 1fr; }
      .content, .view { height: auto; min-height: calc(100vh - 86px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="logo">櫻</div>
        <div><strong>Flex 模板庫</strong><span>SAKURA Welfare</span></div>
      </div>
      <button class="nav-btn active" id="navFlex" type="button"><span class="ico">&lt;/&gt;</span><span>自由版 (Flex)</span><span>›</span></button>
      <div class="folder-panel open" id="flexFolders">
        <button class="folder-head" id="myFolderBtn" type="button"><span>📁</span><span>我的檔案夾</span><span id="savedCount">0</span></button>
      </div>
      <button class="nav-btn" id="navAiAds" type="button"><span class="ico">AI</span><span>AI 廣告工作室</span><span>›</span></button>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <h1 id="pageTitle">Flex Message 模板</h1>
          <div class="sub" id="pageSub">以 Sakura 原生模板庫管理 Flex 版型、分享與推播。</div>
        </div>
        <div class="actions">
          <button class="btn" id="backBtn" type="button" style="display:none;">返回版型庫</button>
          <button class="btn" id="adminBackBtn" type="button">&#36820;&#22238;&#24460;&#21488;</button>
          <button class="btn" id="reloadBtn" type="button">重新載入</button>
          <button class="btn blue" id="shareBtn" type="button">分享好友</button>
          <button class="btn green" id="saveBtn" type="button">儲存版型</button>
        </div>
      </header>

      <section class="content">
        <div class="view active" id="libraryView">
          <div class="library">
            <div class="library-head">
              <h2>選擇 FLEX 版型</h2>
              <p>版型是資料結構，後續新增版型會加在這裡。</p>
            </div>
            <div class="template-grid" id="templateGrid"></div>
          </div>
        </div>

        <div class="view" id="filesView">
          <div class="files">
            <div class="files-head">
              <div>
                <h2>我的檔案夾</h2>
                <p>管理已儲存的自由版 Flex 專案，點「開啟」後進入編輯。</p>
              </div>
              <div class="file-tools">
                <input class="file-search" id="fileSearch" placeholder="搜尋專案名稱、類型、日期">
                <button class="btn green" id="newProjectBtn" type="button">新增自由版名片</button>
              </div>
            </div>
            <div id="fileList"></div>
          </div>
        </div>

        <div class="view" id="editorView">
          <div class="editor">
            <aside class="preview-pane">
              <div class="preview-label" id="previewLabel">LIVE PREVIEW</div>
              <div class="phone" id="phonePreview"></div>
              <div class="preview-label">Simulator v1.0 / Sakura Native</div>
            </aside>
            <section class="form-pane">
              <div class="form-title">
                <div>
                  <h2 id="editorTitle">Flex 編輯器</h2>
                  <p id="editorKicker">VISUAL SIMULATOR FORM</p>
                </div>
                <button class="btn red" id="deleteBtn" type="button">刪除雲端版型</button>
              </div>

              <div class="section">
                <h3><span class="num">1</span>基本設定</h3>
                <div class="grid">
                  <div class="field"><label>檔案名稱</label><input id="fieldName"></div>
                  <div class="field"><label>觸發關鍵字 / Postback Data</label><input id="fieldKeyword"></div>
                </div>
                <div class="grid">
                  <div class="field"><label>Alt Text</label><input id="fieldAlt"></div>
                  <div class="field"><label>分類</label><input id="fieldCategory"></div>
                </div>
              </div>

              <div id="dynamicFields"></div>

              <div class="section">
                <h3><span class="num">3</span>推播與 JSON</h3>
                <div class="grid">
                  <div class="field"><label>LIFF ID</label><input id="fieldLiff" value="2009117474-pwyW1R4u"></div>
                  <div class="field"><label>推播目標 LINE User ID</label><input id="fieldPushTo" placeholder="Uxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"></div>
                </div>
                <div class="actions" style="margin-bottom:14px;">
                  <button class="btn blue" id="pushBtn" type="button">推播</button>
                  <button class="btn" id="copyBtn" type="button">複製 JSON</button>
                  <button class="btn" id="formatBtn" type="button">格式化</button>
                </div>
                <div class="field"><label>Flex Payload JSON</label><textarea class="json-box" id="payloadJson"></textarea></div>
              </div>
            </section>
          </div>
        </div>

      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>

    async function videoUploadRequest(path, options = {}) {
      const response = await fetch(apiBase + "/admin-api/flex-video-upload/" + path, options);

      try { result = await response.json(); } catch (_) { throw new Error("上傳服務回應錯誤。"); }
      if (!response.ok || !result.success) throw new Error(result.message || "上傳失敗。");

    function videoFrame(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file), video = document.createElement("video");
        let done = false;
        const timer = setTimeout(() => finish(new Error("影片讀取逾時，請確認 MP4 可播放。")), 20000);
        function finish(err, result) {
          if (done) return; done = true; clearTimeout(timer); video.removeAttribute("src"); video.load(); URL.revokeObjectURL(url);
          if (err) reject(err); else resolve(result);
        }
        video.preload = "auto"; video.muted = true; video.playsInline = true;
        video.onerror = () => finish(new Error("無法讀取影片，請確認 MP4 可播放。"));
        video.onloadeddata = () => {
          const width = video.videoWidth, height = video.videoHeight;
          if (!width || !height || height > width * 3) return finish(new Error("影片尺寸不符合 LINE 顯示比例，請調整影片後再試。"));
          const divisor = (a, b) => b ? divisor(b, a % b) : a;
          const gcd = divisor(width, height), ratio = (width / gcd) + ":" + (height / gcd);
          const scale = Math.min(1, 1280 / Math.max(width, height));
          const canvas = document.createElement("canvas"); canvas.width = Math.max(1, Math.round(width * scale)); canvas.height = Math.max(1, Math.round(height * scale));

          } catch (_) { finish(new Error("無法擷取影片封面，請確認影片可播放。")); }
        };
        video.src = url;
      });

    async function uploadVideoFile(file) {
      if (!file) return;

      setVideoUploadBusy(true);

      let sessionId = "", completed = false;
      try {
        status.textContent = "正在讀取影片及擷取封面…";
        const frame = await videoFrame(file);
        const init = await videoUploadRequest("init", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({size:file.size}) });
        sessionId = init.sessionId;
        if (!sessionId || !Number.isSafeInteger(init.partSize) || init.partSize < 1) throw new Error("上傳服務回應不完整。");
        const parts = [];
        for (let offset = 0, part = 1; offset < file.size; offset += init.partSize, part++) {
          status.textContent = "影片上傳中… " + Math.floor(offset / file.size * 100) + "%";
          const result = await videoUploadRequest("part?session=" + encodeURIComponent(sessionId) + "&part=" + part, {method:"PUT", headers:{"Content-Type":"application/octet-stream"}, body:file.slice(offset, offset + init.partSize)});
          parts.push({partNumber:result.partNumber, etag:result.etag});

        status.textContent = "正在完成影片上傳…";
        const result = await videoUploadRequest("complete", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({sessionId, parts})});
        completed = true;

        if (generation !== videoUploadGeneration) return;
        setVideoField("videoUrl", result.url); setVideoField("previewUrl", ""); setVideoField("aspectRatio", frame.ratio); updatePayload();
        status.textContent = "正在上傳影片封面…";

        if (!cover.url) throw new Error("封面上傳完成但未取得網址，請另行上傳封面。");

      } catch (err) {

    function checkCoverRatio(file, ratio) {

          <div class="phone-video"><img src="${escapeHtml(data.previewUrl)}" alt=""><div class="play">▶</div></div>
          <div class="phone-body"><div class="phone-title">${escapeHtml(data.title)}</div><div class="phone-text">${escapeHtml(data.body)}</div></div>
          ${buttons.length ? `<div class="phone-actions">${buttons.map((button) => `<div class="phone-action">${escapeHtml(button.action && button.action.label)}</div>`).join("")}</div>` : ""}`;
      } else if (currentTemplate.id === "card") {
        $("phonePreview").innerHTML = `
          <div class="phone-body"><div style="display:flex;gap:14px;align-items:center;"><img src="${escapeHtml(data.avatar)}" style="width:76px;height:76px;border-radius:50%;object-fit:cover;"><div><div class="phone-title">${escapeHtml(data.title)}</div><div class="phone-text">${escapeHtml(data.subtitle)}</div></div></div><div class="phone-text" style="margin-top:18px;">${escapeHtml(data.body)}</div></div>
          <div class="phone-actions"><div class="phone-action">電話聯絡</div><div class="phone-action">官方網站</div><div class="phone-action">加入 LINE</div></div>`;
      } else {
        $("phonePreview").innerHTML = `
          <img src="${escapeHtml(data.hero)}" style="height:170px;">
          <div class="phone-body"><div class="phone-title">${escapeHtml(data.title)}</div></div>
          <div class="product-list">
            ${[1,2,3].map((i) => `<div class="product-row"><img src="${escapeHtml(data["item"+i+"Image"])}"><div><strong>${escapeHtml(data["item"+i+"Name"])}</strong><span>${escapeHtml(data["item"+i+"Price"])}</span></div></div>`).join("")}
          </div>
          <div class="phone-actions"><div class="phone-action" style="background:#06c755;">${escapeHtml(data.buttonText)}</div></div>`;
      }
    }
    async function api(action, data = {}) {
      const response = await fetch(apiBase + "/admin-api/flex-templates", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, data })
      });
      const json = await response.json();
      if (!json.success) throw new Error(json.message || "API 執行失敗");
      return json;
    }
    async function loadCloudTemplates() {
      const response = await fetch(apiBase + "/admin-api/flex-templates");
      const json = await response.json();
      cloudTemplates = json.success ? (json.templates || []) : [];
      renderSavedTemplates();
      return cloudTemplates;
    }
    async function saveCurrent() {
      if (!currentTemplate || !ensureVideoReady()) return;
      updatePayload();
      const pendingVideoSignature = currentTemplate.id === "video" ? videoSignature() : null;
      const data = {
        id: currentRecordId,
        keyword: value("fieldKeyword"),
        name: value("fieldName"),
        category: value("fieldCategory") || currentTemplate.category,
        note: JSON.stringify({ source: "sakura-native-flex", templateId: currentTemplate.id, formData: collectFormData(), altText: value("fieldAlt") }),
        replyType: "FLEX",
        active: true,
        payload: parsePayload()
      };
      const result = await api("template.save", data);
      currentRecordId = result.data && result.data.id || currentRecordId;
      if (currentTemplate.id === "video") savedVideoSignature = pendingVideoSignature;
      toast("已儲存 Flex 版型");
      await loadCloudTemplates();
      renderSavedTemplates();
    }
    async function deleteCurrent() {
      if (!currentRecordId) return toast("目前尚未儲存到雲端。");
      if (!confirm("確定刪除此版型？")) return;
      await api("template.delete", { id: currentRecordId });
      toast("已刪除版型");
      openLibrary();
      await loadCloudTemplates();
    }
    function buildShareMessage() {
      const contents = parsePayload();
      return { type: "flex", altText: value("fieldAlt") || value("fieldName") || "Sakura Flex", contents };
    }
    async function createShareDraft(message) {
      const result = await api("share.create", { message });
      const id = result && result.data && result.data.id;
      if (!id) throw new Error("分享草稿建立失敗。");
      return id;
    }
    async function loadShareDraft(id) {
      if (!id) throw new Error("缺少分享草稿 ID。");
      const result = await api("share.get", { id });
      const message = result && result.data && result.data.message;
      if (!message) throw new Error("分享草稿內容為空。");
      return message;
    }
    function getLiffId() {
      return value("fieldLiff") || localStorage.getItem("sakura_native_liff_id") || DEFAULT_LIFF_ID;
    }
    function canonicalShareUrl(id) {
      const url = new URL("/flex-template-editor", location.origin);
      url.searchParams.set("share", "1");
      if (id) url.searchParams.set("sid", id);
      url.searchParams.set("t", String(Date.now()));
      return url.toString();
    }
    function liffShareUrl(id) {
      return "https://liff.line.me/" + encodeURIComponent(getLiffId()) + "/flex-template-editor?share=1&sid=" + encodeURIComponent(id || "") + "&t=" + Date.now();
    }
    function getShareIdFromLocation() {
      const params = new URLSearchParams(location.search);
      if (params.get("sid")) return params.get("sid");
      const state = params.get("liff.state") || "";
      try {
        const decoded = decodeURIComponent(state);
        const query = decoded.includes("?") ? decoded.split("?")[1] : decoded.replace(/^.*?&/, "");
        return new URLSearchParams(query).get("sid") || "";
      } catch (err) { return ""; }
    }
    function isInFrame() {
      try { return window.top !== window.self; } catch (err) { return true; }
    }
    async function ensureLiffReady() {
      const liffId = getLiffId();
      if (!window.liff) throw new Error("LIFF SDK 尚未載入。");
      if (!liffInitPromise) {
        liffInitPromise = liff.init({ liffId }).then(() => {
          liffReady = true;
          return true;
        });
      }
      await liffInitPromise;
    }
    function warmupLiff() {
      if (!window.liff || liffInitPromise) return;
      liffInitPromise = liff.init({ liffId: getLiffId() }).then(() => {
        liffReady = true;
        return true;
      }).catch((err) => {
        liffInitPromise = null;
        console.warn("LIFF init failed", err);
      });
    }
    async function runShareTargetPicker(message, id) {
      await ensureLiffReady();
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: window.location.href });
        return;
      }
      try {
        const result = await liff.shareTargetPicker([message]);
        if (result) toast("LINE share completed");
        else toast("Share canceled");
      } catch (error) {
        console.error("LIFF SDK Share Error:", error);
        const msg = error && error.message ? error.message : String(error);
        if (msg.includes("not allowed")) {
          alert("LIFF permission changed. Please login again.");
          try { liff.logout(); } catch (_) {}
          window.location.reload();
        } else {
          alert("Share failed: " + msg);
        }
      }
    }
    async function shareCurrent() {
      if (!ensureVideoReady()) return;
      if (!currentTemplate) return;
      updatePayload();
      const message = buildShareMessage();
      localStorage.setItem("sakura_native_liff_id", getLiffId());
      let id = "";
      try {
        id = await createShareDraft(message);
        localStorage.setItem(PENDING_SHARE_KEY, JSON.stringify({ createdAt: Date.now(), id, message }));
        if (isInFrame()) {
          try { window.top.location.href = liffShareUrl(id); }
          catch (err) { location.href = liffShareUrl(id); }
          return;
        }
        await runShareTargetPicker(message, id);
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        if (msg.includes("not allowed")) {
          alert("LIFF 分享權限已更新，將清除舊 Token 並重新登入。");
          try { liff.logout(); } catch (_) {}
          location.href = canonicalShareUrl(id);
        } else alert(msg);
      }
    }
    async function pushCurrent() {
      if (!ensureVideoReady()) return;
      if (!currentTemplate) return;
      updatePayload();
      if (currentTemplate.id === "video" && currentRecordId && videoSignature() !== savedVideoSignature) {
        alert("影音版型有尚未儲存的變更，請先儲存版型再推播。");
        return;
      }
      const payload = parsePayload();
      try {
        await api("template.push", {
          id: currentRecordId,
          to: value("fieldPushTo"),
          replyType: "FLEX",
          altText: value("fieldAlt"),
          payload,
          ...(currentTemplate.id === "video" && currentRecordId ? { expectedPayload: payload } : {})
        });
      } catch (err) {
        if (currentTemplate.id !== "video") throw err;
        alert(err && err.message || "推播失敗，請稍後再試。");
        return;
      }
      toast("已完成 LINE Push 推播");
    }
    function copyJson() {
      navigator.clipboard.writeText($("payloadJson").value).then(() => toast("已複製 JSON"));
    }
    function formatJson() {
      $("payloadJson").value = JSON.stringify(parsePayload(), null, 2);
      renderPreview(parsePayload(), collectFormData());
    }
    function toast(text) {
      $("toast").textContent = text;
      $("toast").classList.add("show");
      setTimeout(() => $("toast").classList.remove("show"), 2200);
    }
    function bind() {
      $("navFlex").addEventListener("click", () => {
        $("flexFolders").classList.toggle("open");
        openLibrary();
      });
      $("myFolderBtn").addEventListener("click", () => {
        $("flexFolders").classList.add("open");
        openFiles();
      });
      $("navAiAds").addEventListener("click", () => {
        if (videoUploadBusy) { alert("上傳中，請等候完成。"); return; }
        window.open("/ai-ads-studio", "_blank", "noopener");
      });
      $("backBtn").addEventListener("click", openLibrary);
      if ($("fileSearch")) $("fileSearch").addEventListener("input", renderFileList);
      if ($("newProjectBtn")) $("newProjectBtn").addEventListener("click", openLibrary);
      $("adminBackBtn").addEventListener("click", () => { location.href = "/sakura-admin"; });
      $("reloadBtn").addEventListener("click", loadCloudTemplates);
      $("saveBtn").addEventListener("click", saveCurrent);
      $("deleteBtn").addEventListener("click", deleteCurrent);
      $("shareBtn").addEventListener("click", shareCurrent);
      $("pushBtn").addEventListener("click", pushCurrent);
      $("copyBtn").addEventListener("click", copyJson);
      $("formatBtn").addEventListener("click", formatJson);
      $("payloadJson").addEventListener("input", () => {
        try { renderPreview(parsePayload(), collectFormData()); } catch (_) {}
      });
    }
    async function resumeShareIfNeeded() {
      const params = new URLSearchParams(location.search);
      const state = params.get("liff.state") || "";
      const shouldShare = params.get("share") === "1" || decodeURIComponent(state).includes("share=1");
      if (!shouldShare) return;
      try {
        const id = getShareIdFromLocation();
        const pending = JSON.parse(localStorage.getItem(PENDING_SHARE_KEY) || "null");
        const message = id ? await loadShareDraft(id) : pending && pending.message;
        if (!message) throw new Error("找不到要分享的 Flex 訊息。");
        await runShareTargetPicker(message, id);
        localStorage.removeItem(PENDING_SHARE_KEY);
      } catch (err) {
        console.error(err);
        alert(err && err.message ? err.message : String(err));
      }
    }
    bind();
    renderTemplateGrid();
    openLibrary();
    loadCloudTemplates();
    warmupLiff();
    resumeShareIfNeeded();
  </script>
</body>
</html>
